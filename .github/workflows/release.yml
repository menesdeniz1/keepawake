name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build (PyInstaller + Inno Setup)
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Locate installer and compute SHA256
        id: build
        shell: pwsh
        run: |
          $name = (Select-String -Path "installer.iss" -Pattern "^OutputBaseFilename=(.+)$").Matches[0].Groups[1].Value.Trim()
          $exePath = "output\$name.exe"

          if (-not (Test-Path $exePath)) {
            throw "Installer bulunamadı: $exePath (Inno Setup adımı başarısız olmuş olabilir)"
          }

          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()

          echo "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          echo "file_name=$name.exe" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          EXE_PATH: ${{ steps.build.outputs.exe_path }}
        run: >
          gh release create "$env:TAG_NAME"
          "$env:EXE_PATH"
          --title "$env:TAG_NAME"
          --generate-notes

      - name: Update latest.json on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          FILE_NAME: ${{ steps.build.outputs.file_name }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          git checkout main
          git pull origin main

          $version = "$env:TAG_NAME" -replace '^v', ''
          $url = "https://github.com/$env:REPO_NAME/releases/download/$env:TAG_NAME/$env:FILE_NAME"

          $manifest = [ordered]@{
            version = $version
            url     = $url
            sha256  = "$env:SHA256"
            notes   = "CI ile otomatik yayınlandı ($env:TAG_NAME)."
          }
          $manifest | ConvertTo-Json | Set-Content -Path latest.json -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for $env:TAG_NAME [skip ci]"
          git push origin main
