name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build (PyInstaller + Inno Setup)
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Locate installer and compute SHA256
        id: build
        shell: pwsh
        run: |
          $name = (Select-String -Path "installer.iss" -Pattern "^OutputBaseFilename=(.+)$").Matches[0].Groups[1].Value.Trim()
          $exePath = "output\$name.exe"

          if (-not (Test-Path $exePath)) {
            throw "Installer bulunamadı: $exePath (Inno Setup adımı başarısız olmuş olabilir)"
          }

          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()

          echo "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          echo "file_name=$name.exe" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "${{ steps.build.outputs.exe_path }}"
          --title "${{ github.ref_name }}"
          --generate-notes

      - name: Update latest.json on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.build.outputs.file_name }}"

          $manifest = [ordered]@{
            version = $version
            url     = $url
            sha256  = "${{ steps.build.outputs.sha256 }}"
            notes   = "CI ile otomatik yayınlandı (${{ github.ref_name }})."
          }
          $manifest | ConvertTo-Json | Set-Content -Path latest.json -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for ${{ github.ref_name }} [skip ci]"
          git push origin main
